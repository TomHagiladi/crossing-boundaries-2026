<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>Crossing Learning Boundaries — Workshop Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F1E8; --field:#E3DCCC; --ink:#15171C; --ink-soft:#474C56;
  --accent:#1E4B8F; --accent-soft:#8FA4C4;
  --display:"Alef",system-ui,sans-serif;
  --body:"Alef",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Alef",ui-monospace,monospace;
  --seam:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--field)}
body{font-family:var(--body);color:var(--ink);line-height:1.55;font-size:17px;
     -webkit-text-size-adjust:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
a.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:99;background:var(--ink);
  color:var(--paper);padding:12px 18px;text-decoration:none}
a.skip:focus{inset-inline-start:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}

/* ---- the seam, carried over from the deck ----------------------------- */
header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:var(--seam) solid var(--ink);padding:10px 18px 9px;
  padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.hlabel{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlabel b{color:var(--accent);font-weight:500}
.langbtn{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;
  background:none;border:2px solid var(--ink);color:var(--ink);border-radius:999px;
  padding:7px 15px;cursor:pointer;min-height:44px}
.langbtn:active{background:var(--ink);color:var(--paper)}
.ticks{display:flex;gap:4px;max-width:640px;margin:8px auto 0}
.ticks i{flex:1;height:3px;background:var(--accent-soft);border-radius:2px}
.ticks i.done{background:var(--accent)}
.ticks i.now{background:var(--ink)}

main{max-width:640px;margin:0 auto;padding:0 18px 140px}
@media (min-width:760px){
  main{max-width:720px;padding:0 28px 150px}
  body{font-size:18px}
  h1{font-size:38px}
  .hrow,.ticks,.nrow{max-width:720px}
}
@media (min-width:1080px){
  main{max-width:1000px}
  h1{font-size:42px}
  .hrow,.ticks,.nrow{max-width:1000px}
  /* the dialogue deck is the one station with enough cards to justify it */
  #prompts{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
  .station[data-s="1"] .card,.station[data-s="2"] .card{max-width:none}
}
/* The station card crosses the seam: it starts above the rule's own band. */
.station{display:none;padding-top:26px}
.station.on{display:block;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .station.on{animation:none} }

.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.2;
  letter-spacing:-.01em;margin:9px 0 14px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:26px 0 10px}
p{margin:0 0 13px}
.lead{font-size:18px}
.muted{color:var(--ink-soft);font-size:15px}

.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;
  padding:16px 17px;margin:14px 0}
.card.soft{border-color:var(--accent-soft)}
.card h3{font-family:var(--body);font-size:17px;font-weight:700;margin:0 0 7px}
.ct{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px}

.prompt{font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--field);
  border-radius:9px;padding:13px 14px;margin:10px 0;white-space:pre-wrap;
  word-break:break-word}
a.tool{display:inline-block;font-weight:700;color:var(--accent);
  text-decoration:none;border-bottom:2px solid var(--accent-soft);
  padding:2px 0;margin-inline-end:4px}
a.tool:active{border-bottom-color:var(--accent)}
.tools{margin:10px 0 2px;line-height:2.2}
.copy{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border:0;border-radius:999px;
  padding:0 18px;min-height:44px;cursor:pointer}
.copy.done{background:var(--accent)}

ul{margin:0 0 13px;padding-inline-start:22px}
li{margin-bottom:7px}

.choice{display:block;width:100%;text-align:start;background:var(--paper);
  border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin:9px 0;
  font:inherit;color:inherit;cursor:pointer;min-height:44px}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.choice[aria-pressed="true"] .muted{color:#d5dded}
.choice b{display:block;font-weight:700;margin-bottom:3px}

label{display:block;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);
  background:var(--paper);border:2px solid var(--ink);border-radius:10px;
  padding:12px 13px;min-height:48px;resize:vertical}
textarea{min-height:88px}

nav.bottom{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--paper);
  border-top:var(--seam) solid var(--ink);padding:11px 18px;
  padding-bottom:max(11px,env(safe-area-inset-bottom))}
.nrow{display:flex;gap:10px;max-width:640px;margin:0 auto}
.btn{flex:1;font-family:var(--body);font-size:16px;font-weight:600;border-radius:999px;
  padding:0 20px;min-height:50px;cursor:pointer;border:2px solid var(--ink)}
.btn.prim{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);flex:0 0 84px;
  font-size:32px;line-height:1;font-weight:400;padding:0}
.btn[disabled]{opacity:.35;cursor:default}

.note{background:var(--accent);color:var(--paper);border-radius:12px;
  padding:14px 16px;margin:16px 0;font-size:16px}
.note b{font-weight:600}
.status{font-family:var(--mono);font-size:13px;margin-top:12px;min-height:20px}
.status.ok{color:var(--accent)} .status.warn{color:#8a3b12}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip">Skip to main content</a>

<header>
  <div class="hrow">
    <span class="hlabel" id="hlabel"></span>
    <button class="langbtn" id="lang" type="button" aria-label="Switch language">עברית</button>
  </div>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
</header>

<main id="main">

<!-- 0 ENTRY -->
<section class="station on" data-s="0" aria-labelledby="t0">
  <div class="eyebrow" data-i="s0eye"></div>
  <h1 id="t0" data-i="s0title"></h1>
  <p class="lead" data-i="s0lead"></p>
  <div class="card">
    <div class="ct" data-i="s0groupct"></div>
    <label for="gname" data-i="s0namelbl"></label>
    <input type="text" id="gname" maxlength="40" autocomplete="off">
    <p class="muted" style="margin-top:9px" data-i="s0namehint"></p>
  </div>
  <div class="note"><b data-i="s0noteb"></b> <span data-i="s0note"></span></div>
</section>

<!-- 1 CHOOSE -->
<section class="station" data-s="1" aria-labelledby="t1">
  <div class="eyebrow" data-i="s1eye"></div>
  <h1 id="t1" data-i="s1title"></h1>
  <p class="lead" data-i="s1lead"></p>

  <h2 data-i="s1doors"></h2>
  <div class="card">
    <div class="ct" data-i="s1act"></div>
    <h3 data-i="s1ah"></h3>
    <div class="prompt" data-i="s1ap"></div>
    <button class="copy" type="button" data-copy="s1ap"></button>
  </div>
  <div class="card">
    <div class="ct" data-i="s1bct"></div>
    <h3 data-i="s1bh"></h3>
    <div class="prompt" data-i="s1bp"></div>
    <button class="copy" type="button" data-copy="s1bp"></button>
  </div>
  <div class="card">
    <div class="ct" data-i="s1cct"></div>
    <h3 data-i="s1ch"></h3>
    <div class="prompt" data-i="s1cp"></div>
    <button class="copy" type="button" data-copy="s1cp"></button>
  </div>

  <h2 data-i="s1modes"></h2>
  <p class="muted" data-i="s1modeslead"></p>
  <button class="choice" type="button" data-mode="shared" aria-pressed="false">
    <b data-i="s1m1"></b><span class="muted" data-i="s1m1d"></span></button>
  <button class="choice" type="button" data-mode="theme" aria-pressed="false">
    <b data-i="s1m2"></b><span class="muted" data-i="s1m2d"></span></button>
  <button class="choice" type="button" data-mode="own" aria-pressed="false">
    <b data-i="s1m3"></b><span class="muted" data-i="s1m3d"></span></button>
  <div class="note"><span data-i="s1amnon"></span></div>
</section>

<!-- 2 PATH -->
<section class="station" data-s="2" aria-labelledby="t2">
  <div class="eyebrow" data-i="s2eye"></div>
  <h1 id="t2" data-i="s2title"></h1>
  <p class="lead" data-i="s2lead"></p>
  <div class="card">
    <div class="ct" data-i="s2pct"></div>
    <div class="prompt" data-i="s2p"></div>
    <button class="copy" type="button" data-copy="s2p"></button>
  </div>
  <h2 data-i="s2media"></h2>
  <!-- Plain https links on purpose. A phone treats these as universal links,
       so the installed app opens if there is one and the website opens if
       there is not. A custom scheme like chatgpt:// would simply fail for
       anyone who has not installed it. -->
  <div class="card soft">
    <h3 data-i="s2m1"></h3><p class="muted" data-i="s2m1d"></p>
    <div class="tools">
      <a class="tool" href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT</a>
      <a class="tool" href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini</a>
      <a class="tool" href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a>
    </div>
  </div>
  <div class="card soft">
    <h3 data-i="s2m2"></h3><p class="muted" data-i="s2m2d"></p>
    <div class="tools">
      <a class="tool" href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a>
    </div>
  </div>
  <div class="card soft">
    <h3 data-i="s2m3"></h3><p class="muted" data-i="s2m3d"></p>
    <div class="tools">
      <a class="tool" href="https://notebooklm.google.com" target="_blank" rel="noopener">NotebookLM</a>
    </div>
  </div>
  <div class="note"><b data-i="s2limitb"></b> <span data-i="s2limit"></span></div>
</section>

<!-- 3 DIALOGUE -->
<section class="station" data-s="3" aria-labelledby="t3">
  <div class="eyebrow" data-i="s3eye"></div>
  <h1 id="t3" data-i="s3title"></h1>
  <div class="note"><b data-i="s3ruleb"></b> <span data-i="s3rule"></span></div>
  <p class="lead" data-i="s3lead"></p>
  <div id="prompts"></div>
</section>

<!-- 4 CONNECT -->
<section class="station" data-s="4" aria-labelledby="t4">
  <div class="eyebrow" data-i="s4eye"></div>
  <h1 id="t4" data-i="s4title"></h1>
  <div class="note"><b data-i="s4stopb"></b> <span data-i="s4stop"></span></div>
  <p class="lead" data-i="s4lead"></p>
  <!-- This card is the pay-off for the choice made back at station 1. Without
       it the choice would set a variable and change nothing, which is no
       choice at all. -->
  <div class="card" id="modecard" hidden>
    <div class="ct" id="modect"></div>
    <p id="modeq"></p>
  </div>
  <div class="card">
    <div class="ct" data-i="s4qct"></div>
    <ul>
      <li data-i="s4q1"></li><li data-i="s4q2"></li>
      <li data-i="s4q3"></li><li data-i="s4q4"></li>
    </ul>
  </div>
</section>

<!-- 5 SHARE -->
<section class="station" data-s="5" aria-labelledby="t5">
  <div class="eyebrow" data-i="s5eye"></div>
  <h1 id="t5" data-i="s5title"></h1>
  <p class="lead" data-i="s5lead"></p>
  <p class="muted" data-i="s5opt"></p>
  <label for="f_ins" data-i="s5insl"></label>
  <textarea id="f_ins" maxlength="400"></textarea>
  <label for="f_con" data-i="s5conl"></label>
  <textarea id="f_con" maxlength="400"></textarea>
  <label for="f_que" data-i="s5quel"></label>
  <textarea id="f_que" maxlength="400"></textarea>
  <div style="margin-top:20px">
    <button class="btn prim" id="send" type="button" style="width:100%"></button>
  </div>
  <div class="status" id="sendstatus" role="status" aria-live="polite"></div>
</section>

<!-- 6 AFTER -->
<section class="station" data-s="6" aria-labelledby="t6">
  <div class="eyebrow" data-i="s6eye"></div>
  <h1 id="t6" data-i="s6title"></h1>
  <p class="lead" data-i="s6lead"></p>
  <div class="card">
    <div class="ct" data-i="s6contact"></div>
    <p>Prof. Amnon Glassner<br>
      <a href="mailto:amnonglassner55@gmail.com" style="color:var(--accent)">amnonglassner55@gmail.com</a>
    </p>
    <p class="muted" data-i="s6contactd"></p>
  </div>
  <div class="card soft">
    <div class="ct" data-i="s6refct"></div>
    <p class="muted">Hagiladi &amp; Glassner, 2026</p>
  </div>
  <p class="muted" style="margin-top:26px" data-i="s6a11y"></p>
</section>

</main>

<nav class="bottom" aria-label="Station navigation">
  <div class="nrow">
    <button class="btn ghost" id="back" type="button">&larr;</button>
    <button class="btn prim" id="fwd" type="button"></button>
  </div>
</nav>

<div class="sr-only" id="live" role="status" aria-live="polite"></div>

<!-- Config first, so window.CB_FIREBASE exists before the initial flush()
     runs. If this file is missing the app still works end to end and every
     submission simply queues. -->
<script src="firebase-config.js"></script>

const TITLES = { en:["Welcome","Choose","Path","Dialogue","Connect","Share","After"],
                 he:["פתיחה","בחירה","מסלול","דיאלוג","חיבור","שיתוף","סיום"] };

/* What the station-1 choice actually changes: the closing conversation.
   Three ways of working produce three genuinely different things to talk
   about at the end, so the choice earns its place. */
const MODEQ = {
 en:{
  shared:["You followed one question together",
    "Where did the two or three of you read the same answer differently? That gap is usually the most interesting thing you found."],
  theme:["You took different angles on one theme",
    "Now that you have heard the others, what does the theme look like that it did not look like twenty minutes ago?"],
  own:["You learned different things",
    "What surprised you most in someone else's topic, and why did it surprise you and not them?"]
 },
 he:{
  shared:["הלכתם יחד אחרי שאלה אחת",
    "איפה שניים או שלושה מכם קראו את אותה תשובה אחרת? הפער הזה הוא בדרך כלל הדבר הכי מעניין שמצאתם."],
  theme:["לקחתם זוויות שונות על נושא אחד",
    "עכשיו, אחרי ששמעתם את האחרים, איך הנושא נראה אחרת ממה שהוא נראה לפני עשרים דקות?"],
  own:["למדתם דברים שונים",
    "מה הכי הפתיע אתכם בנושא של מישהו אחר, ולמה זה הפתיע דווקא אתכם ולא אותו?"]
 }
};

const N = 7;
let lang = 'en', s = 0, mode = null;

/* localStorage can throw in private mode. Every touch is wrapped. */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('cb26_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('cb26_'+k, JSON.stringify(v)); }catch(e){} }
};

const $ = q => document.querySelector(q);
const $$ = q => [...document.querySelectorAll(q)];

function t(k){ return STR[lang][k]; }

function paint(){
  const d = STR[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir  = (lang === 'he') ? 'rtl' : 'ltr';
  $$('[data-i]').forEach(el => { const v = d[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  $('#lang').textContent = d.langbtn;
  $('#send').textContent = d.send;          // has no data-i; it was shipping blank
  $('#back').setAttribute('aria-label', d.back);
  $('#back').innerHTML = (lang === 'he') ? '&rarr;' : '&larr;';
  $$('.copy').forEach(b => { if (!b.classList.contains('done')) b.textContent = d.copy; });
  paintMode();
  buildPrompts();
  paintNav();
}

/* Laptop, tablet or phone. The CSS breakpoints do the layout; this exposes
   the same answer as a data attribute so behaviour can differ too. */
function paintDevice(){
  const w = innerWidth;
  document.documentElement.dataset.device =
    w >= 1080 ? 'desktop' : w >= 760 ? 'tablet' : 'phone';
}

function paintMode(){
  const card = $('#modecard');
  const m = mode && MODEQ[lang][mode];
  if (!m){ card.hidden = true; return; }
  card.hidden = false;
  $('#modect').textContent = m[0];
  $('#modeq').textContent  = m[1];
}

function buildPrompts(){
  const host = $('#prompts'); host.innerHTML = '';
  STR[lang].pr.forEach(([title, body], i) => {
    const c = document.createElement('div'); c.className = 'card';
    const h = document.createElement('div'); h.className = 'ct'; h.textContent = title;
    const p = document.createElement('div'); p.className = 'prompt'; p.textContent = body;
    const b = document.createElement('button');
    b.className = 'copy'; b.type = 'button'; b.textContent = STR[lang].copy;
    b.addEventListener('click', () => doCopy(b, body));
    c.append(h, p, b); host.appendChild(c);
  });
}

function doCopy(btn, text){
  const done = () => {
    btn.textContent = STR[lang].copied; btn.classList.add('done');
    $('#live').textContent = STR[lang].copied;
    setTimeout(() => { btn.textContent = STR[lang].copy; btn.classList.remove('done'); }, 1800);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:-1000px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function paintNav(){
  const d = STR[lang];
  $('#hlabel').innerHTML = TITLES[lang][s] + ' &middot; <b>' + (s+1) + '/' + N + '</b>';
  $('#fwd').textContent = (s === 0) ? d.start : (s === N-1 ? d.finish : d.next);
  $('#back').disabled = (s === 0);
  $('#fwd').disabled  = (s === N-1);
  const ticks = $('#ticks'); ticks.innerHTML = '';
  for (let i = 0; i < N; i++){
    const b = document.createElement('i');
    if (i < s) b.className = 'done'; else if (i === s) b.className = 'now';
    ticks.appendChild(b);
  }
}

function go(n){
  s = Math.max(0, Math.min(N-1, n));
  $$('.station').forEach(el => el.classList.toggle('on', +el.dataset.s === s));
  paintNav(); store.set('s', s);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  $('#main').focus?.();
}

/* ---- sending ---------------------------------------------------------- */
/* Firebase is imported LAZILY and only here. If the CDN never loads, or the
   network is down, the journey above is entirely unaffected and the payload
   is queued in localStorage. This is the failure mode that is easiest to
   miss, because at home everything always loads. */
async function send(){
  const st = $('#sendstatus');
  const payload = {
    group: ($('#gname').value || '').trim().slice(0,40),
    mode: mode,
    insight: $('#f_ins').value.trim().slice(0,400),
    connection: $('#f_con').value.trim().slice(0,400),
    question: $('#f_que').value.trim().slice(0,400),
    lang: lang,
    ts: Date.now()
  };
  if (!payload.insight && !payload.connection && !payload.question){
    st.className = 'status warn'; st.textContent = t('empty'); return;
  }
  $('#send').disabled = true;
  st.className = 'status'; st.textContent = t('sending');
  try{
    await deliver(payload);
    st.className = 'status ok'; st.textContent = t('sent');
    setTimeout(() => go(N-1), 900);
  }catch(e){
    queue(payload);
    st.className = 'status warn'; st.textContent = t('queued');
    setTimeout(() => go(N-1), 1400);
  }
  $('#send').disabled = false;
}

async function deliver(payload){
  if (!window.CB_FIREBASE) throw new Error('not configured');
  const [{ initializeApp }, { getFirestore, collection, addDoc, serverTimestamp }] =
    await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
  const app = window.__cbApp || (window.__cbApp = initializeApp(window.CB_FIREBASE));
  const db = getFirestore(app);
  await addDoc(collection(db, 'cards'), { ...payload, createdAt: serverTimestamp() });
}

function queue(p){ const q = store.get('queue', []); q.push(p); store.set('queue', q); }
async function flush(){
  const q = store.get('queue', []); if (!q.length) return;
  const left = [];
  for (const p of q){ try{ await deliver(p); }catch(e){ left.push(p); } }
  store.set('queue', left);
}

/* ---- wiring ----------------------------------------------------------- */
$('#lang').addEventListener('click', () => {
  lang = (lang === 'en') ? 'he' : 'en'; store.set('lang', lang); paint();
});
$('#fwd').addEventListener('click', () => go(s+1));
$('#back').addEventListener('click', () => go(s-1));
$('#send').addEventListener('click', send);
$$('.choice').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode; store.set('mode', mode);
  $$('.choice').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  paintMode();
}));
addEventListener('resize', paintDevice);
$$('[data-copy]').forEach(b => b.addEventListener('click', () => {
  doCopy(b, STR[lang][b.dataset.copy]);
}));
$('#gname').addEventListener('input', e => store.set('gname', e.target.value));
addEventListener('online', flush);

/* restore */
lang = store.get('lang', 'en');
mode = store.get('mode', null);
if (mode) $$('.choice').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.mode === mode)));
$('#gname').value = store.get('gname', '');
paintDevice();
paint();
go(store.get('s', 0));
flush();
</script>
</body>
</html>
